<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student records at Iyunga Technical Secondary School.">
    <title>Students | Iyunga Technical Secondary School</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="page-main">
        <section class="page-hero compact">
            <div class="container">
                <p class="eyebrow">STUDENT MANAGEMENT</p>
                <h1>Students</h1>
                <p>View and manage registered student information.</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="page-actions">
                    <div>
                        <p class="eyebrow">RECORDS</p>
                        <h2>Student Records</h2>
                    </div>
                    <a class="button primary" href="add-students.html">Add Student <span>+</span></a>
                </div>

                <div class="table-box">
                    <table class="student-table">
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Full Name</th>
                                <th>Gender</th>
                                <th>Level</th>
                                <th>Class</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>—</td>
                                <td>No students registered yet</td>
                                <td>—</td>
                                <td>—</td>
                                <td>—</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <script src="static/script.js"></script>
</body>
</html>
